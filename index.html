<style>
/* =====================================================================
   AMBIENTE MAR · Bitácora Singular · mes 00 · el umbral
   ---------------------------------------------------------------------
   La edición del mes 0 se estampa en mar: luz de superficie arriba,
   columna de agua que se oscurece hacia el fondo. Aquí el mundo entero
   se pinta con esa tinta y la paleta de marca pasa a segundo plano.

   Todo va en SVG y CSS. Ningún <canvas> en el DOM: en el visor móvil se
   queda sin contexto y desaparece.

   Tokens del mundo (los mismos en los cuatro recursos):
     agua      #04141F   fondo, azul hondo
     agua-2    #08202E   paneles y escenas
     agua-3    #0D2E3E   relieve
     abismo    #042B55   fondo de la columna de agua
     hondo     #075D8D   azul medio
     corriente #0E96B5   cian de la corriente
     marea     #36C5D5   tinta del mes
     espuma    #70DFE8
     luz       #E8FEFF   luz de superficie
     coral     #FF9E7A   corales y anémonas
     alga      #86C98F
     arena     #9FB6BE

   La fauna cruza por los laterales. Una máscara la apaga al pasar por
   la columna de lectura para que nunca compita con el texto.
   ===================================================================== */

.mar-bestiario{ position:absolute; width:0; height:0; overflow:hidden }

.mar-fondo{
  position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(120% 58% at 50% -14%, rgba(232,254,255,.28) 0%, rgba(54,197,213,.16) 26%, rgba(4,20,31,0) 62%),
    radial-gradient(70% 40% at 8% 104%, rgba(14,150,181,.16), transparent 70%),
    radial-gradient(70% 40% at 92% 104%, rgba(7,93,141,.18), transparent 70%),
    linear-gradient(#052436 0%, #04141F 44%, #020D15 100%);
}
/* la viñeta apaga el centro para que el texto no compita con el agua.
   Va por debajo de la fauna: si pasara por encima se la comería. */
.mar-fondo::after{
  content:""; position:absolute; inset:0; z-index:2;
  background:radial-gradient(96% 70% at 50% 46%, rgba(2,12,20,.54) 0%, rgba(2,12,20,.80) 62%, rgba(2,12,20,.30) 100%);
}

/* ---------- rayos de luz de la superficie ---------- */
.mar-rayos{
  position:absolute; inset:-10% -20% auto -20%; height:86%; z-index:1;
  background:
    linear-gradient(97deg, transparent 6%, rgba(232,254,255,.10) 8%, transparent 12%),
    linear-gradient(93deg, transparent 24%, rgba(112,223,232,.09) 27%, transparent 31%),
    linear-gradient(99deg, transparent 46%, rgba(232,254,255,.07) 49%, transparent 53%),
    linear-gradient(91deg, transparent 68%, rgba(112,223,232,.08) 71%, transparent 76%),
    linear-gradient(98deg, transparent 86%, rgba(232,254,255,.06) 89%, transparent 93%);
  filter:blur(6px);
  transform-origin:50% 0;
  animation:mar-vaiven 17s ease-in-out infinite alternate;
}
@keyframes mar-vaiven{
  from{ transform:skewX(-1.6deg) translateX(-14px) }
  to{ transform:skewX(1.6deg) translateX(14px) }
}

/* ---------- superficie ---------- */
.mar-olas{
  position:absolute; top:0; left:0; width:200%; height:170px; z-index:7;
  display:block;
}
.mar-ola.a{ animation:mar-correr 26s linear infinite }
.mar-ola.b{ animation:mar-correr 38s linear infinite reverse }
@keyframes mar-correr{
  from{ transform:translateX(0) }
  to{ transform:translateX(-1440px) }
}

/* ---------- el haz de luz, detrás del titular ---------- */
.mar-haz{
  position:absolute; left:50%; top:-30px; transform:translateX(-50%);
  width:min(760px,96vw); height:540px; opacity:.62; z-index:2;
  pointer-events:none;
}

/* ---------- lecho y algas ---------- */
.mar-lecho{
  position:absolute; left:0; bottom:0; width:100%; height:min(340px,42vh);
  z-index:3; display:block; opacity:.9;
}
.mar-jardin{ transform-origin:50% 100%; animation:mar-mecer 11s ease-in-out infinite alternate }

.mar-alga{
  position:absolute; bottom:0; width:118px; height:min(300px,40vh);
  z-index:4; opacity:.5; transform-origin:50% 100%;
  animation:mar-mecer 9s ease-in-out infinite alternate;
}
.mar-alga.izq{ left:-6px }
.mar-alga.izq.dos{ left:64px; height:min(220px,30vh); opacity:.34; animation-duration:13s; animation-delay:-4s }
.mar-alga.der{ right:-6px; transform:scaleX(-1) }
.mar-alga.der.dos{ right:64px; height:min(230px,32vh); opacity:.34; animation-duration:12s; animation-delay:-6s }
@keyframes mar-mecer{
  from{ transform:rotate(-1.8deg) }
  to{ transform:rotate(1.8deg) }
}
.mar-alga.der{ animation-name:mar-mecer-espejo }
@keyframes mar-mecer-espejo{
  from{ transform:scaleX(-1) rotate(-1.8deg) }
  to{ transform:scaleX(-1) rotate(1.8deg) }
}

/* ---------- fauna ---------- */
/* La máscara deja la fauna entera en los laterales y la apaga sobre la
   columna central, que es donde va el texto. */
.mar-fauna{
  position:absolute; inset:0; z-index:5;
  -webkit-mask-image:linear-gradient(90deg,#000 0 12%,rgba(0,0,0,.12) 30%,rgba(0,0,0,.12) 70%,#000 88%);
  mask-image:linear-gradient(90deg,#000 0 12%,rgba(0,0,0,.12) 30%,rgba(0,0,0,.12) 70%,#000 88%);
}
.mar-bicho{
  position:absolute; top:var(--t); left:0; display:block; will-change:transform;
  animation:mar-cruzar var(--dur) linear var(--del) infinite;
}
.mar-bicho.rev{ animation-name:mar-cruzar-rev }
.mar-bicho svg{ display:block }
.mar-nada{
  display:block;
  animation:mar-ondear 4.2s ease-in-out infinite alternate;
}
.mar-bicho.tiburon .mar-nada{ animation-duration:7s }
.mar-bicho.raya .mar-nada{ animation-duration:6.2s }
.mar-bicho.tortuga .mar-nada{ animation-duration:5.4s }
.mar-bicho.banco .mar-nada{ animation-duration:3.4s }

@keyframes mar-cruzar{
  from{ transform:translateX(-26vw) }
  to{ transform:translateX(126vw) }
}
@keyframes mar-cruzar-rev{
  from{ transform:translateX(126vw) }
  to{ transform:translateX(-26vw) }
}
@keyframes mar-ondear{
  from{ transform:scaleX(var(--flip,1)) scale(var(--esc,1)) translateY(-7px) rotate(-2deg) }
  to{ transform:scaleX(var(--flip,1)) scale(var(--esc,1)) translateY(7px) rotate(2deg) }
}

/* medusas: suben en vez de cruzar */
.mar-medusa{
  position:absolute; left:var(--x); bottom:-190px; display:block;
  opacity:.7; animation:mar-ascender var(--dur) linear var(--del) infinite;
}
.mar-medusa svg{ display:block }
.mar-latido{
  display:block; transform-origin:50% 20%;
  animation:mar-latir 3.6s ease-in-out infinite alternate;
}
@keyframes mar-ascender{
  from{ transform:translate(0,0) }
  to{ transform:translate(var(--dx,40px),-124vh) }
}
@keyframes mar-latir{
  from{ transform:scale(var(--esc,1)) scaleY(.94) }
  to{ transform:scale(var(--esc,1)) scaleY(1.06) }
}

/* caballitos: quietos en las algas, solo se balancean */
.mar-caballito{
  position:absolute; bottom:76px; display:block; opacity:.6;
  transform-origin:50% 100%;
  animation:mar-mecer 6.5s ease-in-out infinite alternate;
}
.mar-caballito svg{ display:block }
.mar-caballito.izq{ left:38px }
.mar-caballito.der{ right:44px; animation-delay:-3s; animation-duration:7.5s }

/* ---------- burbujas ---------- */
.mar-burbujas{ position:absolute; inset:0; z-index:6 }
.mar-burbuja{
  position:absolute; bottom:-24px; left:var(--x);
  width:var(--s); height:var(--s); border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(232,254,255,.95), rgba(112,223,232,.35) 60%, rgba(112,223,232,0) 72%);
  box-shadow:0 0 6px rgba(112,223,232,.5);
  opacity:0;
  animation:mar-flotar var(--dur) linear var(--del) infinite;
}
@keyframes mar-flotar{
  0%{ transform:translate(0,0) scale(.7); opacity:0 }
  8%{ opacity:.85 }
  86%{ opacity:.5 }
  100%{ transform:translate(var(--dx),-106vh) scale(1.1); opacity:0 }
}

/* ---------- cinta de edición ---------- */
.mar-cinta{
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  padding:12px 0 0;
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:#9FB6BE;
}
.mar-cinta .gota{
  width:9px; height:9px; border-radius:50%;
  background:#36C5D5; box-shadow:0 0 10px 2px rgba(54,197,213,.75);
  flex:none;
}
.mar-cinta b{ color:#70DFE8; font-weight:500 }

@media (max-width:760px){
  .mar-fauna{
    -webkit-mask-image:none; mask-image:none;
  }
  .mar-bicho{ opacity:.18 }
  .mar-medusa{ opacity:.22 }
  .mar-bicho.tiburon,.mar-bicho.raya,.mar-bicho.tortuga,.mar-medusa.tercera,.mar-caballito{ display:none }
  .mar-alga{ width:80px; opacity:.36 }
  .mar-alga.izq.dos,.mar-alga.der.dos{ display:none }
  .mar-haz{ height:420px; opacity:.42 }
  .mar-lecho{ height:min(260px,34vh) }
  .mar-fondo::after{
    background:radial-gradient(150% 60% at 50% 46%, rgba(2,12,20,.70) 0%, rgba(2,12,20,.86) 58%, rgba(2,12,20,.26) 100%);
  }
}
@media (max-width:520px){
  .mar-cinta .larga{ display:none }
}

@media (prefers-reduced-motion: reduce){
  .mar-rayos,.mar-ola,.mar-jardin,.mar-alga,.mar-caballito,.mar-latido{ animation:none }
  .mar-nada{ animation:none; transform:scaleX(var(--flip,1)) scale(var(--esc,1)) }
  .mar-bicho{ animation:none; transform:translateX(var(--px,20vw)) }
  .mar-medusa{ animation:none; transform:translate(0,var(--py,-46vh)) }
  .mar-burbuja{ animation:none; opacity:.5; transform:translateY(-42vh) }
  .mar-alga.der{ transform:scaleX(-1) }
}

  .num{

<body>
<!-- =====================================================================
     AMBIENTE MAR · mes 00 · el umbral
     Capa decorativa fija: luz de superficie y olas arriba, columna de agua
     que se oscurece hacia el fondo, lecho con corales y algas abajo, y
     fauna cruzando por los laterales.
     Es decorativa entera, así que va con aria-hidden y sin foco.
     ===================================================================== -->
<svg class="mar-bestiario" aria-hidden="true" focusable="false"><defs>

  <!-- pez de perfil -->
  <symbol id="m-pez" viewBox="0 0 132 68">
    <path fill="currentColor" d="M22 34C34 13 60 5 84 9c17 3 32 12 42 25-10 13-25 22-42 25-24 4-50-4-62-25Z"/>
    <path fill="currentColor" opacity=".82" d="M22 34 6 11c-2-3-6-1-5 3l5 20-5 20c-1 4 3 6 5 3Z"/>

        for (const lf of f.leaves){
          const p = puntoEn(pts, lf.t);
          const size = lf.size * unit * (1 - 0.22 * wilt);
          const cH = tonoPlanta(planta.color, wilt, f.luz + 0.1, 0.95);
          dibujarHoja(ctx, p.x, p.y, p.ang + lf.ang + wilt * 1.1, size, cH, 'drop');
          dibujarHoja(ctx, p.x, p.y, p.ang - lf.ang - wilt * 1.1, size * 0.92, cH, 'drop');
        }
        ctx.restore();
      }
    }
  },

  bonsai: {
    build(rnd){
      const wob = [];
      for (let i = 0; i < 20; i++) wob.push((rnd() - 0.5) * 3.4);
      const tronco = {
        x0: 0, angle: -Math.PI/2 + (rnd() - 0.5) * 0.22,
        len: 135 + rnd() * 20, curl: (rnd() < 0.5 ? -1 : 1) * 0.5,
        droop: 0, wobble: wob, width: 15
      };
      const pads = [];
      const defs = [ { t: 0.55, lado: -1 }, { t: 0.8, lado: 1 }, { t: 1.0, lado: -0.18 } ];
      for (const d of defs){
        const nubes = [];
        const nn = 6 + Math.floor(rnd() * 3);
        const spreadX = 34 + rnd() * 14, spreadY = 12 + rnd() * 5;
        for (let k = 0; k < nn; k++){
          nubes.push({ dx: (rnd() - 0.5) * 2 * spreadX, dy: -rnd() * spreadY - 2, r: 9 + rnd() * 8, luz: rnd() * 0.3 });
        }
        pads.push({ t: d.t, lado: d.lado, largo: 34 + rnd() * 28, caida: 0.12 + rnd() * 0.18, nubes });
      }
      const root = { strands: [] };
      for (let i = 0; i < 4; i++){
        root.strands.push({
          x0: (rnd() - 0.5) * 18,
          angle: Math.PI/2 + (rnd() - 0.5) * (i === 0 ? 0.12 : 0.95),
          len: i === 0 ? 140 + rnd() * 30 : 55 + rnd() * 50,
          curl: (rnd() - 0.5) * 0.5,
          width: i === 0 ? 5.5 : 2.6
        });
      }
      return { tronco, pads, root };
    },
    draw(ctx, g, unit, wilt, planta){
      const cTronco = planta.colores.tronco;
      dibujarRaiz(ctx, g.root, unit, cTronco);
      const pts = curva(g.tronco, unit, 0, 0, 0); // el tronco no se marchita, como la raíz
      talloDetalle(ctx, pts, g.tronco.width, 0.72, tonoPlanta(cTronco, 0, 0), unit);
      talloDetalle(ctx, pts, g.tronco.width * 0.38, 0.72, tonoPlanta(planta.colores.troncoOscuro, 0, 0, 0.55), unit);
      for (const pad of g.pads){
        const p = puntoEn(pts, pad.t);
        const angRama = -Math.PI/2 + pad.lado * (Math.PI/2 * 0.78) + pad.caida + wilt * 0.28;
        const bx = p.x + Math.cos(angRama) * pad.largo * unit;
        const by = p.y + Math.sin(angRama) * pad.largo * unit + wilt * 6 * unit;
        ctx.strokeStyle = tonoPlanta(cTronco, 0, 0);
        ctx.lineWidth = 4 * unit;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(
          p.x + Math.cos(angRama) * pad.largo * unit * 0.5,
          p.y + Math.sin(angRama) * pad.largo * unit * 0.5 - 4 * unit,
          bx, by
        );
        ctx.stroke();
        ctx.save();
        if (wilt < 0.85) glowOn(ctx, planta.color, 15 * unit * (1 - wilt));
        for (const n of pad.nubes){
          ctx.fillStyle = tonoPlanta(planta.color, wilt, n.luz);
          ctx.beginPath();
          ctx.arc(bx + n.dx * unit, by + n.dy * unit + wilt * 10 * unit, n.r * unit * (1 - 0.3 * wilt), 0, 6.2832);
          ctx.fill();
        }
        ctx.restore();
      }
    }
  },

  tulipanes: {
    build(rnd){
      const tallos = [];
      const xs = [-34, 34];
      for (let i = 0; i < 2; i++){
        const dir = i === 0 ? -1 : 1;
        tallos.push({
          x0: xs[i], angle: -Math.PI/2 + dir * 0.05,
          len: 188 + rnd() * 30, curl: dir * (0.05 + rnd() * 0.08),
          dir, droop: 0.1, width: 4.4, phase: rnd() * 6.28,
          hojas: [
            { ang: dir * (0.5 + rnd() * 0.2), len: 95 + rnd() * 30 },
            { ang: -dir * (0.32 + rnd() * 0.14), len: 70 + rnd() * 25 }
          ]
        });
      }
      return { tallos };
    },
    draw(ctx, g, unit, wilt, planta, time){
      const cTallo = planta.colores.tallo;
      g.tallos.forEach((tl, i) => {
        const cFlor = i === 0 ? planta.color : planta.colores.pareja;
        const pts = curva(tl, unit, wilt, 0, time);
        for (const h of tl.hojas){
          dibujarHoja(ctx, tl.x0 * unit, 0, -Math.PI/2 + h.ang + wilt * 0.4 * Math.sign(h.ang),
            h.len * unit * (1 - 0.15 * wilt), tonoPlanta(cTallo, wilt, 0.08, 0.95), 'blade');
        }
        talloGlow(ctx, pts, 3.4, tonoPlanta(cTallo, wilt, 0.15), 7 * (1 - wilt * 0.85), 0.7, unit);
        talloDetalle(ctx, pts, tl.width, 0.35, tonoPlanta(cTallo, wilt, 0), unit);
        const tip = pts[pts.length - 1];
        ctx.save();
        ctx.translate(tip.x, tip.y);
        ctx.rotate(tip.ang + Math.PI/2 + wilt * tl.dir * 0.5);
        if (wilt < 0.85) glowOn(ctx, cFlor, 16 * unit * (1 - wilt));
        const w = 27 * unit * (1 - 0.08 * wilt), h = 37 * unit * (1 - 0.18 * wilt);
        copaTulipan(ctx, w, h, tonoPlanta(cFlor, wilt, -0.1), tonoPlanta(cFlor, wilt, 0.18), wilt);
        ctx.restore();
      });
    }
  },

  hostas: {
    build(rnd){
      const hojas = [];
      const n = 13;
      for (let i = 0; i < n; i++){
        const frac = i / (n - 1);
        hojas.push({
          ang: -Math.PI * (0.12 + 0.76 * frac) + (rnd() - 0.5) * 0.12,
          len: 76 + rnd() * 46 + 26 * Math.sin(Math.PI * frac),
          luz: rnd() * 0.28,
          orden: Math.abs(frac - 0.5)
        });
      }
      hojas.sort((a, b) => b.orden - a.orden); // exteriores primero, centro encima
      return { hojas };
    },
    draw(ctx, g, unit, wilt, planta){
      ctx.save();
      if (wilt < 0.85) glowOn(ctx, planta.color, 13 * unit * (1 - wilt));
      for (const h of g.hojas){
        const haciaSuelo = h.ang < -Math.PI/2 ? -1 : 1;
        const ang = h.ang + wilt * 0.55 * haciaSuelo;
        const len = h.len * unit * (1 - 0.12 * wilt);
        dibujarHoja(ctx, 0, 0, ang, len, tonoPlanta(planta.color, wilt, h.luz - 0.14), 'ancha');
        ctx.strokeStyle = tonoPlanta(planta.color, wilt, h.luz + 0.3, 0.8);
        ctx.lineWidth = 1.2 * unit;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * len * 0.9, Math.sin(ang) * len * 0.9);
        ctx.stroke();
      }
      ctx.restore();
    }
  },

  lavanda: {
    build(rnd){
      const tallos = [];
      const n = 7, spread = 132;
      for (let i = 0; i < n; i++){
        const x0 = spread * ((i / (n - 1)) - 0.5) + (rnd() - 0.5) * 8;
        const dir = x0 < 0 ? -1 : 1;
        const flor = [];
        const nf = 9 + Math.floor(rnd() * 3);
        for (let j = 0; j < nf; j++){
          flor.push({ t: 0.76 + (j / (nf - 1)) * 0.24, dx: (j % 3 - 1) * 4.4 + (rnd() - 0.5) * 2, r: 3.4 + rnd() * 1.6, luz: rnd() * 0.3 });
        }
        tallos.push({
          x0, angle: -Math.PI/2 + (rnd() - 0.5) * 0.08 + x0 * 0.0012,
          len: 182 + rnd() * 55, curl: dir * 0.05 * rnd(), dir,
          droop: 0.12, width: 2.8, phase: rnd() * 6.28, flor
        });
      }
      return { tallos };
    },
    draw(ctx, g, unit, wilt, planta, time){
      for (const tl of g.tallos){
        const pts = curva(tl, unit, wilt, 0, time);
        talloDetalle(ctx, pts, tl.width, 0.35, tonoPlanta(planta.colores.tallo, wilt, 0.05), unit);
        ctx.save();
        if (wilt < 0.85) glowOn(ctx, planta.color, 12 * unit * (1 - wilt));
        for (const f of tl.flor){
          const p = puntoEn(pts, f.t);
          const per = p.ang + Math.PI/2;
          const x = p.x + Math.cos(per) * f.dx * unit;
          const y = p.y + Math.sin(per) * f.dx * unit;
          ctx.fillStyle = tonoPlanta(planta.color, wilt, f.luz);
          ctx.beginPath();
          ctx.ellipse(x, y, f.r * unit * (1 - 0.25 * wilt), f.r * unit * 0.72 * (1 - 0.25 * wilt), p.ang, 0, 6.2832);
          ctx.fill();
        }
        ctx.restore();
      }
    }
  },

  hierba: {
    build(rnd){
      const hojas = [];
      for (let i = 0; i < 12; i++){
        const dir = rnd() < 0.5 ? -1 : 1;
        hojas.push({
          x0: (rnd() - 0.5) * 104,
          angle: -Math.PI/2 + (rnd() - 0.5) * 0.6,
          len: 145 + rnd() * 85,
          curl: (0.25 + rnd() * 0.4) * dir,
          dir, droop: 0.18, width: 5 + rnd() * 1.6,
          phase: rnd() * 6.28, luz: rnd() * 0.2
        });
      }
      return { hojas, sway: true };
    },
    draw(ctx, g, unit, wilt, planta, time){
      const swayVal = (!REDUCED && wilt < 0.5) ? (1 - wilt * 2) : 0;
      for (const b of g.hojas){
        const pts = curva(b, unit, wilt, swayVal, time);
        talloGlow(ctx, pts, b.width * 0.8, tonoPlanta(planta.color, wilt, 0.05), 9 * (1 - wilt * 0.85), 0.7, unit);
        talloDetalle(ctx, pts, b.width, 1, tonoPlanta(planta.color, wilt, b.luz), unit);
        const tip = pts[pts.length - 1];
        ctx.save();
        if (wilt < 0.85) glowOn(ctx, planta.colores.punta, 13 * unit * (1 - wilt));
        ctx.fillStyle = tonoPlanta(planta.colores.punta, wilt, 0.1);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 3 * unit * (1 - 0.3 * wilt), 0, 6.2832);
        ctx.fill();
        ctx.restore();
      }
    }
  },

  fuente: {
    build(rnd){
      const chorros = [];
      const n = 9;
      for (let i = 0; i < n; i++){
        const lado = i - (n - 1) / 2;
        const dir = lado >= 0 ? 1 : -1;
        const mag = Math.abs(lado) / ((n - 1) / 2);
        const gotas = [];
        const ng = 1 + Math.floor(rnd() * 2);
        for (let k = 0; k < ng; k++) gotas.push({ d: 10 + k * 13 + rnd() * 6, r: 3.2 + rnd() * 1.6 });
        chorros.push({
          x0: (rnd() - 0.5) * 20,
          angle: -Math.PI/2 + dir * 0.1 * mag,
          len: 165 + rnd() * 60 * (1 - mag * 0.3),
          curl: dir * (0.55 + 0.85 * mag),
          dir, droop: 0.13, width: 3.1,
          phase: rnd() * 6.28, luz: rnd() * 0.2, gotas
        });
      }
      return { chorros };
    },
    draw(ctx, g, unit, wilt, planta, time){
      for (const ch of g.chorros){
        const pts = curva(ch, unit, wilt, 0, time);
        talloGlow(ctx, pts, 2.6, tonoPlanta(planta.color, wilt, 0.12), 10 * (1 - wilt * 0.85), 0.8, unit);
        talloDetalle(ctx, pts, ch.width, 0.75, tonoPlanta(planta.color, wilt, ch.luz), unit);
        const tip = pts[pts.length - 1];
        ctx.save();
        if (wilt < 0.85) glowOn(ctx, planta.color, 15 * unit * (1 - wilt));
        ctx.fillStyle = tonoPlanta(planta.color, wilt, 0.3);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 4.4 * unit * (1 - 0.3 * wilt), 0, 6.2832);
        ctx.fill();
        if (wilt < 0.6){
          ctx.globalAlpha = 1 - wilt / 0.6;
          for (const gt of ch.gotas){
            const gx = tip.x + Math.cos(tip.ang) * gt.d * unit;
            const gy = tip.y + Math.sin(tip.ang) * gt.d * unit + wilt * 20 * unit;
            ctx.beginPath();
            ctx.arc(gx, gy, gt.r * unit, 0, 6.2832);
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }
  },

  girasol: {
    build(rnd){
      const semillas = [];
      const nS = 42;
      for (let i = 0; i < nS; i++){
        semillas.push({ a: i * 2.39996, r: Math.sqrt((i + 0.5) / nS), luz: rnd() * 0.25 });
      }
      const petalos = [];
      const nP = 16;
      for (let i = 0; i < nP; i++){
        petalos.push({ a: (i / nP) * 6.2832 + (rnd() - 0.5) * 0.1, len: 1 + (rnd() - 0.5) * 0.14, luz: rnd() * 0.2 });
      }
      const dir = rnd() < 0.5 ? -1 : 1;
      return {
        tallo: { x0: 0, angle: -Math.PI/2 + (rnd() - 0.5) * 0.06, len: 222, curl: dir * 0.12, dir, droop: 0.09, width: 6.5, phase: 0 },
        hojas: [ { t: 0.38, side: -1, size: 58 + rnd() * 12 }, { t: 0.58, side: 1, size: 50 + rnd() * 12 } ],
        semillas, petalos, inclinacion: (rnd() - 0.5) * 0.15
      };
    },
    draw(ctx, g, unit, wilt, planta, time){
      const cTallo = planta.colores.tallo;
      const pts = curva(g.tallo, unit, wilt, 0, time);
      talloDetalle(ctx, pts, g.tallo.width, 0.45, tonoPlanta(cTallo, wilt, 0), unit);
      for (const h of g.hojas){
        const p = puntoEn(pts, h.t);
        dibujarHoja(ctx, p.x, p.y, p.ang + h.side * 1.0 + wilt * 1.0 * h.side,
          h.size * unit * (1 - 0.2 * wilt), tonoPlanta(cTallo, wilt, 0.12, 0.95), 'drop');
      }
      const tip = pts[pts.length - 1];
      const R = 34 * unit * (1 - 0.08 * wilt);
      ctx.save();
      ctx.translate(tip.x, tip.y);
      ctx.rotate(tip.ang + Math.PI/2 + g.inclinacion + wilt * 0.3 * g.tallo.dir);
      ctx.scale(1, 1 - 0.18 * wilt);
      ctx.save();
      if (wilt < 0.85) glowOn(ctx, planta.color, 17 * unit * (1 - wilt));
      for (const p of g.petalos){
        dibujarHoja(ctx, Math.cos(p.a) * R * 0.5, Math.sin(p.a) * R * 0.5, p.a,
          R * 0.95 * p.len * (1 - 0.2 * wilt), tonoPlanta(planta.color, wilt, p.luz), 'drop');
      }
      ctx.restore();
      ctx.fillStyle = tonoPlanta(planta.colores.centro, wilt * 0.5, 0);
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.58, 0, 6.2832);
      ctx.fill();
      for (const s of g.semillas){
        ctx.fillStyle = tonoPlanta(planta.colores.semilla, wilt * 0.5, s.luz);
        const rr = s.r * R * 0.5;
        ctx.beginPath();
        ctx.arc(Math.cos(s.a) * rr, Math.sin(s.a) * rr, R * 0.045, 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
    }
  },

  cerezo: {
    build(rnd){
      const ramas = [], flores = [], caidas = [];
      function rama(x, y, ang, len, w, depth){
        const n = 6;
        let cx = x, cy = y, a = ang;
        const ptsR = [{ x: cx, y: cy }];
        const curl = (rnd() - 0.5) * 0.5;
        for (let i = 1; i <= n; i++){
          a += curl / n;
          cx += Math.cos(a) * len / n;
          cy += Math.sin(a) * len / n;
          ptsR.push({ x: cx, y: cy });
        }
        ramas.push({ pts: ptsR, w, depth });
        if (depth >= 3){
          const nf = 4 + Math.floor(rnd() * 4);
          for (let k = 0; k < nf; k++){
            flores.push({ x: cx + (rnd() - 0.5) * 26, y: cy + (rnd() - 0.5) * 20 - 4, r: 4 + rnd() * 3.4, luz: rnd() * 0.35 });
          }
          return;
        }
        const hijos = depth === 0 ? 3 : (2 + (rnd() < 0.4 ? 1 : 0));
        for (let h = 0; h < hijos; h++){
          const na = a + (rnd() - 0.5) * 1.15 - 0.12;
          rama(cx, cy, na, len * (0.62 + rnd() * 0.12), w * 0.55, depth + 1);
        }
      }
      rama(0, 0, -Math.PI/2 + (rnd() - 0.5) * 0.12, 105, 13, 0);
      for (let i = 0; i < 14; i++){
        caidas.push({ x: (rnd() - 0.5) * 220, y: -rnd() * 150 - 10, r: 2.2 + rnd() * 1.4, alpha: 0.35 + rnd() * 0.4, extra: rnd() < 0.5 });
      }
      for (let i = 0; i < 10; i++){
        caidas.push({ x: (rnd() - 0.5) * 200, y: -2 - rnd() * 4, r: 2 + rnd() * 1.4, alpha: 0.5 + rnd() * 0.3, extra: false });
      }
      return { ramas, flores, caidas };
    },
    draw(ctx, g, unit, wilt, planta){
      const cT = planta.colores.tronco;
      ctx.lineCap = 'round';
      for (const r of g.ramas){
        ctx.strokeStyle = tonoPlanta(cT, 0, r.depth * 0.06);
        const dy = wilt * r.depth * 4 * unit;
        for (let i = 1; i < r.pts.length; i++){
          const t = i / (r.pts.length - 1);
          ctx.lineWidth = Math.max(0.7, r.w * unit * (1 - 0.5 * t));
          ctx.beginPath();
          ctx.moveTo(r.pts[i-1].x * unit, r.pts[i-1].y * unit + dy);
          ctx.lineTo(r.pts[i].x * unit, r.pts[i].y * unit + dy);
          ctx.stroke();
        }
      }
      ctx.save();
      if (wilt < 0.85) glowOn(ctx, planta.color, 13 * unit * (1 - wilt));
      for (const f of g.flores){
        ctx.globalAlpha = 1 - 0.35 * wilt;
        ctx.fillStyle = tonoPlanta(planta.color, wilt, f.luz);
        ctx.beginPath();
        ctx.arc(f.x * unit, f.y * unit + wilt * 14 * unit, f.r * unit * (1 - 0.3 * wilt), 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // pétalos sueltos: los marcados como extra solo caen al marchitar
      for (const c of g.caidas){
        const a = c.extra ? c.alpha * wilt : c.alpha * 0.85;
        if (a < 0.03) continue;
        ctx.globalAlpha = a;
        ctx.fillStyle = tonoPlanta(planta.color, wilt * 0.5, 0.2);
        ctx.beginPath();
        ctx.arc(c.x * unit, c.y * unit + (c.extra ? wilt * 30 * unit : 0), c.r * unit, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }
};

function dibujarSuelo(ctx, baseX, baseY, w, unit, alcance){
  const ancho = alcance || Math.min(w * 0.7, 320 * unit);
  const g = ctx.createLinearGradient(0, baseY - 2, 0, baseY + 26 * unit);
  g.addColorStop(0, 'rgba(54,197,213,0.30)');
  g.addColorStop(1, 'rgba(54,197,213,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(baseX, baseY + 8 * unit, ancho / 2, 14 * unit, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,212,224,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(baseX - ancho / 2, baseY);
  ctx.lineTo(baseX + ancho / 2, baseY);
  ctx.stroke();
}

function renderPlanta(ctx, planta, baseX, baseY, hBudget, growth, wilt, time){
  if (!planta._geom) planta._geom = FORMAS[planta.forma].build(mulberry32(planta.seed));
  const unit = hBudget / 380;
  ctx.save();
  ctx.translate(baseX, baseY);
  const g = REDUCED ? 1 : Math.max(0.0001, easeOutBack(Math.min(1, growth)));
  ctx.scale(g, g);
  FORMAS[planta.forma].draw(ctx, planta._geom, unit, wilt, planta, time || 0);
  ctx.restore();
}

/* ---------- estado y construcción del DOM ---------- */
const seleccion = new Set();
const cards = [];

function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

function chipBateria(key){
  const b = CONFIG.baterias[key];
  const c = el('span', 'chip');
  const p = el('span', 'punto');
  p.style.background = b.color;
  p.style.boxShadow = '0 0 8px ' + b.color;
  c.appendChild(p);
  c.appendChild(document.createTextNode(b.label));
  return c;
}

function montarTextos(){
  document.getElementById('kicker').textContent = T.kicker;
  document.getElementById('titulo').textContent = T.titulo;
  document.getElementById('lede').textContent = T.lede;
  const intro = document.getElementById('intro');
  T.intro.forEach(p => intro.appendChild(el('p', null, p)));
  intro.appendChild(el('p', 'nota-privacidad', T.privacidad));
  const ley = document.getElementById('leyenda');
  ley.appendChild(el('span', 'titulo-leyenda', T.leyendaTitulo));
  Object.keys(CONFIG.baterias).forEach(k => ley.appendChild(chipBateria(k)));
  ley.appendChild(el('p', null, T.leyendaTexto));
  document.getElementById('jardin-titulo').textContent = T.jardinTitulo;
  document.getElementById('vacio').textContent = T.vacio;

  document.getElementById('nota-export').textContent = T.notaExport;
  document.getElementById('cierre').innerHTML = T.cierre;
  document.getElementById('tagline').textContent = CONFIG.marca.tagline;
  actualizarContador();
}

function montarCards(){
  const main = document.getElementById('jardin');
  CONFIG.plantas.forEach((planta, i) => {
    const card = el('article', 'card');
    card.style.setProperty('--planta', planta.color);

    const escena = el('div', 'escena');
    const num = el('span', 'num', 'Planta ' + String(i + 1).padStart(2, '0') + ' / ' + String(CONFIG.plantas.length).padStart(2, '0'));
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    escena.appendChild(num);
    escena.appendChild(canvas);

    const ficha = el('div', 'ficha');
    const head = el('div');
    head.appendChild(el('h2', null, planta.nombre));
    head.appendChild(el('p', 'que-es', planta.queEs));
    ficha.appendChild(head);

    const campoBat = el('div', 'campo');
    campoBat.appendChild(el('p', 'etiqueta', T.etiquetaBaterias));
    const bats = el('div', 'baterias');
    planta.baterias.forEach(b => bats.appendChild(chipBateria(b)));
    campoBat.appendChild(bats);
    ficha.appendChild(campoBat);

    const campoCul = el('div', 'campo');
    campoCul.appendChild(el('p', 'etiqueta', T.etiquetaCultivo));
    const ul = el('ul', 'cultivo');
    planta.cultivo.forEach(c => ul.appendChild(el('li', null, c)));
    campoCul.appendChild(ul);
    ficha.appendChild(campoCul);

    const campoMar = el('div', 'campo');
    campoMar.appendChild(el('p', 'etiqueta', T.etiquetaMarchita));
    const bloque = el('div', 'marchita-bloque');
    bloque.appendChild(el('p', 'receta', planta.marchita.receta));
    bloque.appendChild(el('p', 'condicion', planta.marchita.condicion));
    campoMar.appendChild(bloque);
    ficha.appendChild(campoMar);

    const campoLec = el('div', 'campo');
    campoLec.appendChild(el('p', 'etiqueta', T.etiquetaLectura));
    campoLec.appendChild(el('p', 'lectura', planta.lectura));
    ficha.appendChild(campoLec);

    const acciones = el('div', 'acciones');
    const btnM = el('button', 'btn-marchita', T.btnMarchitar);
    btnM.setAttribute('aria-pressed', 'false');
    const btnP = el('button', 'btn-plantar', T.btnPlantar);
    btnP.setAttribute('aria-pressed', 'false');
    acciones.appendChild(btnM);
    acciones.appendChild(btnP);
    ficha.appendChild(acciones);

    card.appendChild(escena);
    card.appendChild(ficha);
    main.appendChild(card);

    const estado = {
      planta, card, canvas, btnM, btnP,
      growth: REDUCED ? 1 : 0,
      wilt: 0, wiltDesde: 0, wiltHacia: 0, wiltT0: 0,
      creciendo: false, visto: false, visible: false
    };
    ponerAria(estado);
    cards.push(estado);

    btnM.addEventListener('click', () => alternarMarchita(estado));
    btnP.addEventListener('click', () => alternarPlantada(estado));
  });
}

function ponerAria(st){
  const marchita = st.wiltHacia > 0.5;
  const tpl = marchita ? T.ariaMarchita : T.ariaFlorece;
  st.canvas.setAttribute('aria-label', tpl.replace('{nombre}', st.planta.nombre));
}

/* ---------- interacción ---------- */
function alternarMarchita(st){
  const hacia = st.wiltHacia > 0.5 ? 0 : 1;
  st.wiltHacia = hacia;
  st.btnM.textContent = hacia ? T.btnReponer : T.btnMarchitar;
  st.btnM.setAttribute('aria-pressed', hacia ? 'true' : 'false');
  st.card.classList.toggle('wilted', hacia === 1);
  ponerAria(st);
  if (REDUCED){
    st.wilt = hacia;
    pintarCard(st, 0);
  } else {
    st.wiltDesde = st.wilt;
    st.wiltT0 = performance.now();
    despertar();
  }
}

function alternarPlantada(st){
  const id = st.planta.id;
  if (seleccion.has(id)) seleccion.delete(id);
  else seleccion.add(id);
  const dentro = seleccion.has(id);
  st.btnP.textContent = dentro ? T.btnPlantada : T.btnPlantar;
  st.btnP.setAttribute('aria-pressed', dentro ? 'true' : 'false');
  actualizarContador();
  refrescarJardin();
}

function actualizarContador(){
  const n = seleccion.size;
  const c = document.getElementById('contador');
  if (n === 0) c.textContent = T.contadorCero;
  else if (n === 1) c.textContent = T.contadorUna;
  else c.textContent = T.contadorVarias.replace('{n}', n);
  document.getElementById('btn-export').disabled = n === 0;
  document.getElementById('vacio').hidden = n > 0;
  document.getElementById('preview-marco').hidden = n === 0;
}

/* ---------- pintado de cards ---------- */
function medirCanvas(canvas){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));
  if (canvas.width !== w * dpr || canvas.height !== h * dpr){
    canvas.width = w * dpr;
    canvas.height = h * dpr;
  }
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h, dpr };
}

function pintarCard(st, time){
  const medida = medirCanvas(st.canvas);
  if (!medida) return;
  const { ctx, w, h, dpr } = medida;
  GLOW_ESCALA = dpr;
  ctx.clearRect(0, 0, w, h);
  const baseX = w / 2, baseY = h * 0.86;
  const unit = (h * 0.95) / 380;
  dibujarSuelo(ctx, baseX, baseY, w, unit);
  renderPlanta(ctx, st.planta, baseX, baseY, h * 0.95, st.growth, st.wilt, time);
  GLOW_ESCALA = 1;
}

/* ---------- bucle de animación (solo mientras haga falta) ---------- */
let rafId = null;
function despertar(){
  if (rafId == null && !REDUCED) rafId = requestAnimationFrame(tick);
}
function tick(now){
  rafId = null;
  let activo = false;
  for (const st of cards){
    let cambia = false;
    if (st.creciendo){
      const t = Math.min(1, (now - st.crecT0) / CONFIG.animacion.crecimientoMs);
      st.growth = t;
      if (t >= 1) st.creciendo = false; else activo = true;
      cambia = true;
    }
    if (st.wilt !== st.wiltHacia){
      const t = Math.min(1, (now - st.wiltT0) / CONFIG.animacion.marchitarMs);
      st.wilt = st.wiltDesde + (st.wiltHacia - st.wiltDesde) * easeInOut(t);
      if (t >= 1) st.wilt = st.wiltHacia; else activo = true;
      cambia = true;
    }
    const meciendo = st.planta._geom && st.planta._geom.sway && st.visible && st.wilt < 0.5;
    if (meciendo){ activo = true; cambia = true; }
    if (cambia && st.visto) pintarCard(st, now);
  }
  if (activo) rafId = requestAnimationFrame(tick);
}

/* ---------- reveals con IntersectionObserver ---------- */
function montarObserver(){
  if (!('IntersectionObserver' in window)){
    for (const st of cards){ st.visible = true; st.visto = true; st.card.classList.add('on'); }
    return;
  }
  const io = new IntersectionObserver(entries => {
    for (const entry of entries){
      const st = cards.find(c => c.card === entry.target);
      if (!st) continue;
      st.visible = entry.isIntersecting;
      if (entry.isIntersecting && !st.visto){
        st.visto = true;
        st.card.classList.add('on');
        if (REDUCED){
          st.growth = 1;
          pintarCard(st, 0);
        } else {
          st.creciendo = true;
          st.crecT0 = performance.now();
          despertar();
        }
      } else if (entry.isIntersecting){
        despertar();
      }
    }
  }, { threshold: CONFIG.animacion.umbralObserver });
  cards.forEach(st => io.observe(st.card));
}

/* ---------- composición del jardín (preview + export) ---------- */
function plantasSeleccionadas(){
  return CONFIG.plantas.filter(p => seleccion.has(p.id));
}

function layoutJardin(n){
  const W = 1200, margen = 96;
  const cols = Math.min(3, Math.max(1, n));
  const filas = Math.ceil(n / cols);
  const celdaW = (W - margen * 2) / cols;
  const plantaH = 280, etiquetasH = 92, filaH = plantaH + etiquetasH;
  const cabeceraH = 150, pieH = 96;
  const H = margen + cabeceraH + filas * filaH + pieH + margen * 0.6;
  return { W, H, margen, cols, filas, celdaW, plantaH, etiquetasH, filaH, cabeceraH };
}

function dibujarJardin(ctx, lista, L){
  ctx.fillStyle = CONFIG.marca.carbon;
  ctx.fillRect(0, 0, L.W, L.H);

  ctx.save();
  glowOn(ctx, CONFIG.marca.ocre, 12);
  ctx.fillStyle = CONFIG.marca.ocre;
  ctx.font = '500 15px "IBM Plex Mono", monospace';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillText(T.exportKicker.toUpperCase(), L.margen, L.margen + 4);
  ctx.restore();
  ctx.fillStyle = CONFIG.marca.crema;
  ctx.font = '600 52px "Fraunces", serif';
  ctx.textAlign = 'left';
  ctx.fillText(T.exportTitulo, L.margen - 2, L.margen + 62);
  ctx.strokeStyle = 'rgba(233,250,252,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L.margen, L.margen + 96);
  ctx.lineTo(L.W - L.margen, L.margen + 96);
  ctx.stroke();

  lista.forEach((planta, i) => {
    const col = i % L.cols, fila = Math.floor(i / L.cols);
    const cx = L.margen + L.celdaW * (col + 0.5);
    const baseY = L.margen + L.cabeceraH + fila * L.filaH + L.plantaH;
    const unit = L.plantaH / 380;
    dibujarSuelo(ctx, cx, baseY, L.celdaW, unit, L.celdaW * 0.78);
    renderPlanta(ctx, planta, cx, baseY, L.plantaH, 1, 0, 0);

    ctx.textAlign = 'center';
    ctx.fillStyle = CONFIG.marca.crema;
    ctx.font = '600 23px "Fraunces", serif';
    ctx.fillText(planta.nombre, cx, baseY + 44);
    ctx.font = '400 13px "IBM Plex Mono", monospace';
    const partes = planta.baterias.map(b => CONFIG.baterias[b].label);
    const sep = '   ';
    const texto = partes.join(sep);
    const anchoTotal = ctx.measureText(texto).width + partes.length * 16;
    let x = cx - anchoTotal / 2;
    const yB = baseY + 70;
    partes.forEach((label, k) => {
      const key = planta.baterias[k];
      ctx.fillStyle = CONFIG.baterias[key].color;
      ctx.beginPath();
      ctx.arc(x + 5, yB - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(233,250,252,0.75)';
      ctx.textAlign = 'left';
      ctx.fillText(label, x + 16, yB);
      x += 16 + ctx.measureText(label + sep).width;
    });
    ctx.textAlign = 'center';
  });

  const yPie = L.H - L.margen * 0.6 - 34;
  ctx.strokeStyle = 'rgba(233,250,252,0.2)';
  ctx.beginPath();
  ctx.moveTo(L.margen, yPie);
  ctx.lineTo(L.W - L.margen, yPie);
  ctx.stroke();
  ctx.fillStyle = 'rgba(233,250,252,0.55)';
  ctx.font = '400 13px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(CONFIG.marca.tagline, L.W / 2, yPie + 32);
  ctx.textAlign = 'left';
}

let fuentesListas = false;
function conFuentes(fn){
  if (fuentesListas || !document.fonts){ fn(); return; }
  Promise.all([
    document.fonts.load('600 52px "Fraunces"'),
    document.fonts.load('400 13px "IBM Plex Mono"')
  ]).then(() => document.fonts.ready).then(() => {
    fuentesListas = true;
    fn();
  }).catch(fn);
}

function refrescarJardin(){
  const lista = plantasSeleccionadas();
  if (lista.length === 0) return;
  conFuentes(() => {
    const L = layoutJardin(lista.length);
    const off = document.createElement('canvas');
    off.width = L.W; off.height = L.H;
    GLOW_ESCALA = 1;
    const octx = off.getContext('2d');
    if (!octx) return;
    dibujarJardin(octx, lista, L);
    const preview = document.getElementById('preview');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const rect = preview.parentElement.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.round(w * L.H / L.W);
    preview.width = w * dpr;
    preview.height = h * dpr;
    preview.style.height = h + 'px';
    const pctx = preview.getContext('2d');
    if (!pctx) return;
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.imageSmoothingEnabled = true;
    pctx.imageSmoothingQuality = 'high';
    pctx.drawImage(off, 0, 0, w, h);
  });
}

function exportarPNG(){
  const lista = plantasSeleccionadas();
  if (lista.length === 0) return;
  conFuentes(() => {
    const L = layoutJardin(lista.length);
    const SS = 2; // 2x supersampling
    const cnv = document.createElement('canvas');
    cnv.width = L.W * SS;
    cnv.height = L.H * SS;
    const ctx = cnv.getContext('2d');
    if (!ctx) return;
    ctx.scale(SS, SS);
    GLOW_ESCALA = SS;
    dibujarJardin(ctx, lista, L);
    GLOW_ESCALA = 1;
    const a = document.createElement('a');
    a.href = cnv.toDataURL('image/png');
    a.download = 'mi-jardin-singular-club.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

/* ---------- arranque ---------- */
function repintarTodo(){
  cards.forEach(st => { if (st.visto) pintarCard(st, 0); });
  refrescarJardin();
}

montarTextos();
montarCards();
montarObserver();
document.getElementById('btn-export').addEventListener('click', exportarPNG);

let resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(repintarTodo, 160);
});

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { fuentesListas = true; refrescarJardin(); });
}
})();
</script>
